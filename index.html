<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Loan Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }

    header {
      background: #2b6cb0;
      color: #fff;
      padding: 1.25rem 1.5rem;
      text-align: center;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p { font-size: 0.85rem; opacity: 0.8; margin-top: 0.25rem; }

    .main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem; }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 620px) { .cards { grid-template-columns: 1fr; } }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    .card-header {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .card-header h2 { font-size: 1.1rem; font-weight: 700; }

    .btn-add {
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-add:hover { background: #2c5282; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .stat {
      padding: 0.75rem 1rem;
      text-align: center;
    }
    .stat + .stat { border-left: 1px solid #e2e8f0; }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #718096; }
    .stat-value { font-size: 1.1rem; font-weight: 700; margin-top: 0.15rem; }
    .stat-value.green { color: #276749; }
    .stat-value.red { color: #c53030; }
    .stat-value.blue { color: #2b6cb0; }

    .loan-amount-row {
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.82rem;
      color: #4a5568;
    }
    .loan-amount-row label { white-space: nowrap; }
    .loan-amount-row input {
      border: 1px solid #cbd5e0;
      border-radius: 5px;
      padding: 0.3rem 0.5rem;
      font-size: 0.82rem;
      width: 110px;
    }
    .btn-save-loan {
      background: #e2e8f0;
      border: none;
      border-radius: 5px;
      padding: 0.3rem 0.6rem;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-save-loan:hover { background: #cbd5e0; }

    .history { padding: 0.75rem 1.25rem; }
    .history h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #718096; margin-bottom: 0.5rem; }

    .payment-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }

    .payment-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.5rem 0.6rem;
      border-radius: 7px;
      background: #f7fafc;
      border: 1px solid #edf2f7;
    }
    .payment-left { display: flex; align-items: flex-start; gap: 0.5rem; }
    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      text-transform: uppercase;
      white-space: nowrap;
      margin-top: 0.1rem;
    }
    .badge-cash { background: #bee3f8; color: #2a69ac; }
    .badge-expense { background: #feebc8; color: #c05621; }
    .payment-desc { font-size: 0.82rem; }
    .payment-date { font-size: 0.72rem; color: #a0aec0; }
    .payment-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .payment-amount { font-size: 0.9rem; font-weight: 700; color: #276749; }
    .btn-delete {
      background: none;
      border: none;
      color: #e53e3e;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0 0.1rem;
      opacity: 0.6;
    }
    .btn-delete:hover { opacity: 1; }

    .empty-msg { font-size: 0.82rem; color: #a0aec0; text-align: center; padding: 0.75rem 0; }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      margin: 1rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .modal-header {
      background: #2b6cb0;
      color: #fff;
      padding: 1rem 1.25rem;
      font-weight: 700;
      font-size: 1rem;
    }
    .modal-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.85rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #4a5568; margin-bottom: 0.3rem; }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1px solid #cbd5e0;
      border-radius: 7px;
      padding: 0.5rem 0.7rem;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .type-toggle { display: flex; gap: 0.5rem; }
    .type-btn {
      flex: 1;
      padding: 0.5rem;
      border: 2px solid #cbd5e0;
      border-radius: 7px;
      background: #f7fafc;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .type-btn.active-cash { border-color: #2b6cb0; background: #ebf8ff; color: #2b6cb0; }
    .type-btn.active-expense { border-color: #dd6b20; background: #fffaf0; color: #dd6b20; }

    .modal-footer {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 0.6rem;
      justify-content: flex-end;
    }
    .btn-cancel {
      background: #edf2f7;
      border: none;
      border-radius: 7px;
      padding: 0.5rem 1.1rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel:hover { background: #e2e8f0; }
    .btn-submit {
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 0.5rem 1.25rem;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-submit:hover { background: #2c5282; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg { color: #c53030; font-size: 0.78rem; }
  </style>
</head>
<body>

<header>
  <h1>🏡 Family Loan Tracker</h1>
  <p>Tracking what you owe, one payment at a time</p>
</header>

<div class="main">
  <div class="cards" id="cards-container">
    <!-- cards rendered by JS -->
  </div>
</div>

<!-- Payment Modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header" id="modal-title">Add Payment</div>
    <div class="modal-body">
      <div class="form-group">
        <label>Type</label>
        <div class="type-toggle">
          <button class="type-btn active-cash" id="btn-type-cash" onclick="setType('cash')">💵 Cash</button>
          <button class="type-btn" id="btn-type-expense" onclick="setType('expense')">🧾 Expense</button>
        </div>
      </div>
      <div class="form-group">
        <label for="input-amount">Amount ($)</label>
        <input type="number" id="input-amount" min="0.01" step="0.01" placeholder="0.00" />
      </div>
      <div class="form-group">
        <label for="input-desc">Description</label>
        <textarea id="input-desc" placeholder="e.g. Paid for dinner, Birthday gift, Check…"></textarea>
      </div>
      <div class="form-group">
        <label for="input-date">Date</label>
        <input type="date" id="input-date" />
      </div>
      <div class="error-msg" id="modal-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-submit" id="btn-submit" onclick="submitPayment()">Save Payment</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, getDoc, onSnapshot,
    addDoc, deleteDoc, query, where, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyucRF0yiJwj-EmmRiHxwdhulPrXFf8RY",
    authDomain: "loantracker-a7ffc.firebaseapp.com",
    projectId: "loantracker-a7ffc",
    storageBucket: "loantracker-a7ffc.firebasestorage.app",
    messagingSenderId: "399527740993",
    appId: "1:399527740993:web:d95cea70ee39dc3b38e8c0",
    measurementId: "G-SN809D65J0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const LENDERS = [
    { id: "mil",    name: "Mother-in-Law", emoji: "👩" },
    { id: "grandma", name: "Grandmother",  emoji: "👵" },
  ];

  // State
  const state = {
    lenders: {},   // id -> { originalAmount }
    payments: {},  // id -> [payment, ...]
  };

  // ── Bootstrap lender docs ──────────────────────────────────────────────────
  async function ensureLenderDoc(lender) {
    const ref = doc(db, "lenders", lender.id);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, { name: lender.name, originalAmount: 0, createdAt: serverTimestamp() });
    }
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function fmt(n) {
    return "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderCard(lender) {
    const data   = state.lenders[lender.id] || {};
    const pymnts = state.payments[lender.id] || [];
    const original = Number(data.originalAmount || 0);
    const totalRepaid = pymnts.reduce((s, p) => s + Number(p.amount), 0);
    const balance = original - totalRepaid;

    return `
      <div class="card" id="card-${lender.id}">
        <div class="card-header">
          <h2>${lender.emoji} ${lender.name}</h2>
          <button class="btn-add" onclick="openModal('${lender.id}')">+ Add Payment</button>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="stat-label">Original Loan</div>
            <div class="stat-value blue">${fmt(original)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Repaid</div>
            <div class="stat-value green">${fmt(totalRepaid)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Still Owed</div>
            <div class="stat-value ${balance > 0 ? 'red' : 'green'}">${fmt(balance)}</div>
          </div>
        </div>
        <div class="loan-amount-row">
          <label for="loan-input-${lender.id}">Loan amount:</label>
          <input type="number" id="loan-input-${lender.id}" min="0" step="0.01"
            value="${original || ""}" placeholder="0.00" />
          <button class="btn-save-loan" onclick="saveLoanAmount('${lender.id}')">Save</button>
        </div>
        <div class="history">
          <h3>Payment History</h3>
          <ul class="payment-list">
            ${pymnts.length === 0
              ? `<li class="empty-msg">No payments yet — add one above!</li>`
              : pymnts.map(p => `
                <li class="payment-item">
                  <div class="payment-left">
                    <span class="badge badge-${p.type}">${p.type === "cash" ? "💵 Cash" : "🧾 Expense"}</span>
                    <div>
                      <div class="payment-desc">${escHtml(p.description || "")}</div>
                      <div class="payment-date">${p.date || ""}</div>
                    </div>
                  </div>
                  <div class="payment-right">
                    <span class="payment-amount">${fmt(p.amount)}</span>
                    <button class="btn-delete" title="Delete" onclick="deletePayment('${p.id}', '${lender.id}')">✕</button>
                  </div>
                </li>`).join("")}
          </ul>
        </div>
      </div>`;
  }

  function renderAll() {
    const container = document.getElementById("cards-container");
    container.innerHTML = LENDERS.map(renderCard).join("");
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── Firestore listeners ────────────────────────────────────────────────────
  function startListeners() {
    for (const lender of LENDERS) {
      // Lender doc
      onSnapshot(doc(db, "lenders", lender.id), snap => {
        state.lenders[lender.id] = snap.data() || {};
        renderAll();
      });

      // Payments
      const q = query(
        collection(db, "payments"),
        where("lenderId", "==", lender.id),
        orderBy("date", "desc"),
        orderBy("createdAt", "desc")
      );
      onSnapshot(q, snap => {
        state.payments[lender.id] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAll();
      });
    }
  }

  // ── Loan amount ────────────────────────────────────────────────────────────
  window.saveLoanAmount = async function(lenderId) {
    const input = document.getElementById(`loan-input-${lenderId}`);
    const val = parseFloat(input.value);
    if (isNaN(val) || val < 0) return;
    await setDoc(doc(db, "lenders", lenderId), { originalAmount: val }, { merge: true });
  };

  // ── Modal ──────────────────────────────────────────────────────────────────
  let currentLenderId = null;
  let currentType = "cash";

  window.openModal = function(lenderId) {
    currentLenderId = lenderId;
    currentType = "cash";
    const lender = LENDERS.find(l => l.id === lenderId);
    document.getElementById("modal-title").textContent = `Add Payment — ${lender.emoji} ${lender.name}`;
    document.getElementById("input-amount").value = "";
    document.getElementById("input-desc").value = "";
    document.getElementById("input-date").value = new Date().toISOString().slice(0, 10);
    document.getElementById("modal-error").textContent = "";
    setType("cash");
    document.getElementById("modal-backdrop").classList.add("open");
    setTimeout(() => document.getElementById("input-amount").focus(), 50);
  };

  window.closeModal = function() {
    document.getElementById("modal-backdrop").classList.remove("open");
    currentLenderId = null;
  };

  window.setType = function(type) {
    currentType = type;
    const cashBtn    = document.getElementById("btn-type-cash");
    const expenseBtn = document.getElementById("btn-type-expense");
    cashBtn.className    = "type-btn" + (type === "cash"    ? " active-cash"    : "");
    expenseBtn.className = "type-btn" + (type === "expense" ? " active-expense" : "");
  };

  window.submitPayment = async function() {
    const amount = parseFloat(document.getElementById("input-amount").value);
    const desc   = document.getElementById("input-desc").value.trim();
    const date   = document.getElementById("input-date").value;
    const errEl  = document.getElementById("modal-error");
    errEl.textContent = "";

    if (!amount || amount <= 0)   { errEl.textContent = "Please enter a valid amount."; return; }
    if (!desc)                    { errEl.textContent = "Please add a description."; return; }
    if (!date)                    { errEl.textContent = "Please select a date."; return; }

    const btn = document.getElementById("btn-submit");
    btn.disabled = true;
    btn.textContent = "Saving…";

    try {
      await addDoc(collection(db, "payments"), {
        lenderId: currentLenderId,
        type: currentType,
        amount,
        description: desc,
        date,
        createdAt: serverTimestamp(),
      });
      closeModal();
    } catch (e) {
      errEl.textContent = "Error saving: " + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Save Payment";
    }
  };

  window.deletePayment = async function(paymentId, lenderId) {
    if (!confirm("Delete this payment?")) return;
    await deleteDoc(doc(db, "payments", paymentId));
  };

  // Close modal on backdrop click
  document.getElementById("modal-backdrop").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeModal();
  });

  // Enter key submits modal
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  (async () => {
    renderAll(); // initial empty render
    await Promise.all(LENDERS.map(ensureLenderDoc));
    startListeners();
  })();
</script>
</body>
</html>
